<!DOCTYPE html>
<html>
    <head>
        <title>Radiology mAs Calculator</title>

        <!-- Bootstrap -->
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">

         <!-- Bootstrap Icons-->
        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

           <!-- Our CSS -->
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <div class="container mt-5">
            <div class="calculator mx-auto p-4">

            <!-- Logo -->
            <div class="logo">
                <i class="bi bi-radioactive"></i>
            </div>
            <h1 class="text-center">Radiology</h1>
            <h2 class="text-center">mAs Calculator</h2>

             <!-- mA -->
            <label for="ma"
            class="form-lable">mA</label>
            <input
                type="number"
                id="ma"
                class="form-control mb-3"
                placeholder="Enter mA">

              <!-- Time -->
            <lable for="time"
            class="form-lable">Time(second)</lable>
            <input
                type="number"
                id="time"
                class="form-control mb-3"
                placeholder="Enter time">

              <!-- Button -->
            <button
                type="button"
                class="btn btn-primary mx-auto d-block"
                onclick="calculate()">
                Calculate mAs
            </button>

            <!-- Result -->
            <div id="result" class="result mt-4">mAs =
            </div>
        </div>
    </div>
    <script>
        function calculate() {
            let ma = Number(document.getElementById("ma").value);
            let time = Number(document.getElementById("time").value);
            let mas = ma * time;
            document.getElementById("result").innerHTML =
                "mAs = " + mas
        }
    </script>
</body>
</html>
